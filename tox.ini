[tox]
skipsdist = True
envlist = flake8

[testenv]
basepython = python3

[testenv:flake8]
deps = flake8
commands = flake8 {posargs}

# F401 'xxx' imported not unused
# E402 module level import not at top of file
# W293 blank line contains whitespace is OK
[flake8]
ignore = F401,E402,W293,E501
max-line-length = 125
